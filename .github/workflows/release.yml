name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Cheap and first: a mistyped tag should fail in seconds, not after the
  # full CI matrix has run.
  version-check:
    name: version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # main.version is injected by ldflags in both build paths, so a tag that
      # disagrees with flake.nix means `work --version` lies about the build.
      - name: Check tag matches flake.nix version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FLAKE=$(sed -n 's/.*version = "\([0-9][^"]*\)".*/\1/p' flake.nix | head -1)
          if [ "$TAG" != "$FLAKE" ]; then
            echo "::error::tag v$TAG does not match flake.nix version $FLAKE"
            exit 1
          fi
          echo "tag v$TAG matches flake.nix"

  # The same suite that gates main and pull requests, re-run against the
  # tagged commit. Tag pushes don't trigger CI on their own.
  ci:
    name: ci
    needs: version-check
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser publishes the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
