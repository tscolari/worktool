version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  settings:
    errcheck:
      # Writes to an already-open stdout/stderr and a deferred close on a
      # read-only file. errcheck stays on for everything else.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
